# Finans / Ödeme Planı — schema contract
# Metadata only. No DB data.
# DEPLOY_BLOCKER: kpi_filtered view / finans sorgusunun beklenen yapısı
# mevcut DB şemasına göre doğrulanamamıştır.
# Bu blocker giderilmeden bu modül için deploy önerilmez.

module = "finans_odeme_plani"
pilot_baseline = "cb593bd6794544a45bb7e8c42ef70c49ff6a041c"

known_blockers = [
    "kpi_filtered view may not exist or may have changed — verify before deploy",
]

owner_files = [
    "app/modules/finans/odeme_plani_routes.py",
]

critical_routes = [
    "/finans/odeme-plani",
    "/finans/odeme-plani/liste",
]

