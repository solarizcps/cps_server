    "Cari_Kart",
    "Cari_Har",
    "Banka_Kart",
    "Kasa_Kart",
    "Cek_Senet",
]
write_tables = [
    "Cari_Har",
]

# Mevcut canonical DB'deki applied migration'lar arasında
