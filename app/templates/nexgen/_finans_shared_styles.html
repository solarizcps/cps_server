{# Finans modülü ortak CSS — Genel Bakış referans #}
<style>
:root {
  --rm-teal: #006a8e;
  --rm-teal-dark: #005a7a;
  --rm-gold: #f6c343;
  --rm-orange: #f97316;
  --rm-green: #16a34a;
  --rm-blue: #2563eb;
  --rm-purple: #7c3aed;
  --rm-border: #e2e8f0;
  --rm-border2: #cbd5e1;
  --rm-bg: #f8fafc;
  --rm-bg2: #f1f5f9;
  --rm-t1: #0f172a;
  --rm-t2: #374151;
  --rm-t3: #6b7280;
  --rm-t4: #9ca3af;
  --rm-white: #ffffff;
  --rm-font: 'Inter', system-ui, -apple-system, sans-serif;
  --fm-content-max: 1400px;
  --fm-hdr-h: 61px;
  --fm-nav-h: 34px;
  --fm-input-h: 30px;
  --fm-btn-h: 28px;
  --fm-radius: 8px;
  --fm-radius-sm: 6px;
}
.fm-modul-sayfa, .fm-modul-sayfa * { box-sizing: border-box; font-family: var(--rm-font); }
.fm-modul-sayfa {
  display: flex; flex-direction: column; gap: 6px;
  padding: 0 12px 12px; max-width: var(--fm-content-max); margin: 0 auto;
  overflow-x: hidden; min-height: 0;
}
.fm-page-hdr-unified {
  display: flex; align-items: center; justify-content: space-between;
  height: var(--fm-hdr-h); padding: 0 12px; margin: 0 -12px;
  border-bottom: 1px solid var(--rm-border); flex-shrink: 0;
}
.fm-page-hdr-unified .rm-page-hdr-sol { display: flex; align-items: center; gap: 12px; min-width: 0; }
.fm-page-hdr-unified .rm-page-logo { width: 150px; height: 61px; object-fit: contain; object-position: left center; flex-shrink: 0; }
.fm-page-hdr-unified .rm-page-bc { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--rm-t3); white-space: nowrap; }
.fm-page-hdr-unified .rm-page-bc-cur { font-size: 12px; font-weight: 700; color: var(--rm-t1); }
.fm-page-hdr-unified .fm-hdr-baslik { font-size: 14px; font-weight: 800; color: var(--rm-t1); line-height: 1.2; margin-top: 1px; }
.fm-page-hdr-unified .fm-hdr-alt { font-size: 10px; color: var(--rm-t3); margin-top: 1px; max-width: 520px; line-height: 1.35; }
.fm-page-hdr-unified .fm-hdr-sag { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.fm-guncelleme { font-size: 10px; color: var(--rm-t4); white-space: nowrap; }
.fm-btn-yenile, .rm-yeni-btn {
  font-size: 10px; font-weight: 700; padding: 5px 12px; height: var(--fm-btn-h);
  background: var(--rm-gold); color: var(--rm-t1); border: none; border-radius: var(--fm-radius-sm);
  cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
}
.fm-btn-yenile:hover, .rm-yeni-btn:hover { filter: brightness(0.97); }
.rm-page-geri {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; height: var(--fm-btn-h);
  border-radius: var(--fm-radius-sm); border: 1px solid var(--rm-border); background: var(--rm-white);
  font-size: 11px; font-weight: 600; color: var(--rm-t2); text-decoration: none;
}
.rm-page-geri:hover { background: var(--rm-bg); }
.fm-container-unified { display: flex; flex-direction: column; gap: 8px; }
.fm-ic-nav {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px;
  border-bottom: 1px solid var(--rm-border); padding-bottom: 4px; min-height: var(--fm-nav-h);
}
.fm-ic-nav-link { text-decoration: none; color: inherit; }
.fm-ic-nav .rm-sekme {
  font-size: 11px; font-weight: 600; padding: 6px 11px; border-radius: 6px 6px 0 0;
  color: var(--rm-t3); cursor: pointer; white-space: nowrap; border: 1px solid transparent; margin-bottom: -1px;
}
.fm-ic-nav .rm-sekme.aktif {
  color: var(--rm-teal); background: var(--rm-white); border-color: var(--rm-border);
  border-bottom-color: var(--rm-white);
}
.fm-ic-nav-disabled {
  font-size: 10px; font-weight: 600; padding: 6px 9px; color: var(--rm-t4);
  opacity: 0.55; cursor: not-allowed; pointer-events: none; white-space: nowrap;
}
.fm-ic-nav-disabled::after { content: ' · Yakında'; font-size: 9px; font-weight: 500; }
.fm-sub-nav {
  display: flex; gap: 4px; border-bottom: 1px solid var(--rm-border2);
  background: var(--rm-bg); padding: 4px 8px 0; border-radius: var(--fm-radius-sm) var(--fm-radius-sm) 0 0;
}
.fm-sub-nav .rm-sekme { font-size: 10px; padding: 5px 10px; }
.fm-kpi-compact {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px;
}
.fm-kpi-compact .rm-kpi {
  background: var(--rm-white); border: 1px solid var(--rm-border); border-radius: var(--fm-radius);
  padding: 8px 10px; min-height: 52px; border-top-width: 3px;
}
.fm-kpi-compact .rm-kpi-sayi { font-size: 16px; font-weight: 800; color: var(--rm-t1); line-height: 1.1; }
.fm-kpi-compact .rm-kpi-etiket { font-size: 9px; font-weight: 600; color: var(--rm-t3); margin-top: 2px; text-transform: uppercase; letter-spacing: .3px; }
.rm-kpi-gold { border-top-color: var(--rm-gold); }
.rm-kpi-yellow { border-top-color: #eab308; }
.rm-kpi-green { border-top-color: var(--rm-green); }
.rm-kpi-orange { border-top-color: var(--rm-orange); }
.rm-kpi-purple { border-top-color: var(--rm-purple); }
.rm-panel-unified {
  background: var(--rm-white); border: 1px solid var(--rm-border); border-radius: var(--fm-radius);
  overflow: hidden; display: flex; flex-direction: column;
}
.rm-panel-unified .rm-panel-hdr-lite {
  padding: 8px 12px; border-bottom: 1px solid var(--rm-border); background: var(--rm-bg);
}
.rm-panel-unified .rm-panel-baslik { font-size: 11px; font-weight: 700; color: var(--rm-t1); }
.rm-panel-unified .rm-panel-hdr-alt { font-size: 10px; color: var(--rm-t3); }
.fm-filtre-band { padding: 8px 10px; }
.fm-filtre-satir { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fm-ara-wrap {
  display: flex; align-items: center; gap: 6px; flex: 1 1 160px; min-width: 120px;
  padding: 5px 9px; border: 1px solid var(--rm-border2); border-radius: var(--fm-radius-sm);
  background: var(--rm-white); height: var(--fm-input-h);
}
.fm-ara-input { flex: 1; border: none; outline: none; font-size: 10px; background: transparent; font-family: var(--rm-font); }
.fm-fil-sel, .fm-tarih-inp {
  font-size: 10px; padding: 5px 8px; border: 1px solid var(--rm-border2);
  border-radius: var(--fm-radius-sm); height: var(--fm-input-h); font-family: var(--rm-font); background: var(--rm-white);
}
.fm-fil-temizle {
  font-size: 10px; font-weight: 600; padding: 5px 10px; height: var(--fm-input-h);
  border: 1px solid var(--rm-border2); border-radius: var(--fm-radius-sm); background: var(--rm-white); cursor: pointer;
}
.fm-layout-unified { display: grid; grid-template-columns: 65fr 35fr; gap: 8px; align-items: start; }
.fm-tablo { width: 100%; border-collapse: collapse; font-size: 10px; }
.fm-th {
  text-align: left; padding: 6px 8px; background: var(--rm-bg2); font-weight: 700;
  color: var(--rm-t2); border-bottom: 1px solid var(--rm-border); font-size: 9px; text-transform: uppercase; white-space: nowrap;
}
.fm-th-r { text-align: right; }
.fm-tablo td { padding: 6px 8px; border-bottom: 1px solid var(--rm-border); color: var(--rm-t1); vertical-align: top; }
.fm-tablo tr:hover { background: var(--rm-bg); }
.fm-tablo-scroll { overflow: auto; max-height: calc(100vh - 320px); min-height: 160px; }
.fm-rozet {
  display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 9px; font-weight: 700; border: 1px solid transparent;
}
.fm-rozet-bekliyor { background: #fef9c3; color: #854d0e; border-color: rgba(202,138,4,.25); }
.fm-rozet-onay, .fm-rozet-dogrulandi, .fm-rozet-post-ok { background: #dcfce7; color: #166534; border-color: rgba(22,163,74,.25); }
.fm-rozet-eksik, .fm-rozet-post-no { background: #ffedd5; color: #9a3412; border-color: rgba(249,115,22,.25); }
.fm-rozet-manuel { background: #f3e8ff; color: #6b21a8; border-color: rgba(124,58,237,.25); }
.fm-rozet-nötr, .fm-rozet-pasif { background: var(--rm-bg2); color: var(--rm-t3); border-color: var(--rm-border); }
.fm-rozet-red, .fm-rozet-cakisma { background: #fef2f2; color: #b91c1c; border-color: rgba(220,38,38,.25); }
.fm-empty-compact {
  padding: 20px 12px; text-align: center; color: var(--rm-t3); font-size: 11px;
  border: 1px dashed var(--rm-border); border-radius: var(--fm-radius-sm); background: var(--rm-bg);
}
.fm-empty-compact .fm-empty-title { font-weight: 700; color: var(--rm-t2); font-size: 11px; margin-bottom: 4px; }
.fm-empty-compact .fm-empty-desc { font-size: 10px; color: var(--rm-t4); }
.fm-detay-bolum { margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--rm-border); }
.fm-detay-bolum:last-child { border-bottom: none; }
.fm-bolum-baslik { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--rm-teal); margin-bottom: 6px; letter-spacing: .35px; }
.fm-ozet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 10px; }
.fm-ozet-satir span { display: block; color: var(--rm-t4); font-size: 9px; text-transform: uppercase; }
.fm-ozet-satir strong { color: var(--rm-t2); font-weight: 600; word-break: break-word; }
.fm-toast {
  position: fixed; bottom: 16px; right: 16px; z-index: 9500; padding: 10px 14px;
  border-radius: var(--fm-radius-sm); font-size: 11px; max-width: 360px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none;
}
.fm-toast-ok { background: #f0fdf4; color: #15803d; border: 1px solid rgba(22,163,74,.3); }
.fm-toast-hata { background: #fef2f2; color: #b91c1c; border: 1px solid rgba(220,38,38,.3); }
.fm-modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45);
  z-index: 9000; align-items: center; justify-content: center;
}
.fm-modal-overlay.acik { display: flex; }
.fm-modal-kutu {
  background: var(--rm-white); border-radius: var(--fm-radius); max-width: 480px; width: 94%;
  max-height: 90vh; overflow: hidden; display: flex; flex-direction: column;
  border: 1px solid var(--rm-border);
}
.fm-modal-kutu-genis { max-width: 640px; }
.fm-modal-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--rm-border); font-weight: 700; font-size: 12px;
}
.fm-modal-kapat { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--rm-t3); line-height: 1; }
.fm-modal-body { padding: 14px 16px; overflow-y: auto; font-size: 11px; }
.fm-modal-uyari {
  background: #fff7ed; border: 1px solid rgba(234,88,12,.35); color: #c2410c;
  padding: 8px 10px; border-radius: var(--fm-radius-sm); font-size: 10px; margin-bottom: 10px;
}
.fm-modal-uyari-red { background: #fef2f2; border-color: rgba(220,38,38,.35); color: #b91c1c; }
.fm-modal-lbl { display: block; font-size: 10px; font-weight: 700; margin: 8px 0 4px; color: var(--rm-t2); }
.fm-modal-textarea, .fm-modal-input {
  width: 100%; box-sizing: border-box; font-size: 11px; padding: 8px;
  border: 1px solid var(--rm-border2); border-radius: var(--fm-radius-sm); font-family: var(--rm-font);
}
.fm-modal-hata { color: #b91c1c; font-size: 10px; margin-top: 8px; }
.fm-modal-ftr {
  display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--rm-border);
}
.fm-btn { font-size: 10px; font-weight: 600; padding: 5px 10px; border-radius: var(--fm-radius-sm); border: 1px solid var(--rm-border2); background: var(--rm-white); cursor: pointer; font-family: var(--rm-font); height: var(--fm-btn-h); }
.fm-btn-primary { background: var(--rm-gold); color: var(--rm-t1); border-color: var(--rm-gold); }
.fm-btn-teal { background: var(--rm-teal); color: #fff; border-color: var(--rm-teal); }
.fm-btn-danger { background: #fef2f2; color: #b91c1c; border-color: rgba(220,38,38,.35); }
.fm-btn:disabled { opacity: .45; cursor: not-allowed; }
.fm-sayfalama { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px; font-size: 10px; border-top: 1px solid var(--rm-border); }
.fm-sayfa-btn { border: 1px solid var(--rm-border2); background: var(--rm-white); border-radius: var(--fm-radius-sm); padding: 4px 10px; font-size: 10px; cursor: pointer; height: 26px; }
.fm-sayfa-btn:disabled { opacity: .45; cursor: default; }
/* Workbench / iş kuyruğu */
.fm-hizli-ara-band { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.fm-hizli-ara-band .fm-ara-wrap { flex: 1; max-width: 360px; }
.fd-kuyruk-genis { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px; }
.fd-kuyruk-kutu { display: block; padding: 10px; border: 1px solid var(--rm-border); border-radius: var(--fm-radius-sm); text-decoration: none; color: inherit; background: var(--rm-bg); transition: border-color .15s, background .15s; border-left-width: 3px; }
.fd-kuyruk-kutu:hover { border-color: var(--rm-teal); background: var(--rm-white); }
.fd-kuyruk-kutu.fd-kq-sari { border-left-color: #eab308; }
.fd-kuyruk-kutu.fd-kq-turuncu { border-left-color: var(--rm-orange); }
.fd-kuyruk-kutu.fd-kq-yesil { border-left-color: var(--rm-green); }
.fd-kuyruk-kutu.fd-kq-mor { border-left-color: var(--rm-purple); }
.fd-kuyruk-kutu.fd-kq-kirmizi { border-left-color: #dc2626; }
.fd-kuyruk-kutu.fd-kq-mavi { border-left-color: var(--rm-teal); }
.fd-kuyruk-sayi { font-size: 18px; font-weight: 800; color: var(--rm-teal); line-height: 1.1; }
.fd-kuyruk-etiket { font-size: 10px; font-weight: 700; color: var(--rm-t1); margin-top: 2px; }
.fd-kuyruk-aciklama { font-size: 9px; color: var(--rm-t3); margin-top: 3px; line-height: 1.3; }
.fd-kuyruk-aksiyon { font-size: 9px; font-weight: 600; color: var(--rm-teal); margin-top: 4px; }
.fm-wb-adim { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; border-radius: var(--fm-radius-sm); background: var(--rm-bg); font-size: 10px; margin-bottom: 2px; text-decoration: none; color: inherit; border: 1px solid transparent; }
a.fm-wb-adim:hover { border-color: var(--rm-teal); background: var(--rm-white); }
.fm-wb-adim.fm-wb-aktif { background: #e0f2fe; border-color: #bae6fd; }
.fm-wb-adim.fm-wb-pasif { opacity: .55; cursor: default; pointer-events: none; }
.fm-wb-lbl { font-weight: 600; color: var(--rm-t2); }
.fm-wb-n { font-weight: 800; color: var(--rm-teal); font-size: 11px; }
.fm-wb-ok { text-align: center; font-size: 9px; color: var(--rm-t4); line-height: 1; margin: 1px 0; }
.fm-surec-mini { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--rm-border); background: var(--rm-bg); }
.fm-surec-adim-mini { font-size: 9px; font-weight: 600; padding: 3px 7px; border-radius: 999px; border: 1px solid var(--rm-border); color: var(--rm-t3); white-space: nowrap; }
.fm-surec-adim-mini.fm-sm-tamam { background: #dcfce7; color: #166534; border-color: rgba(22,163,74,.25); }
.fm-surec-adim-mini.fm-sm-aktif { background: #e0f2fe; color: #0369a1; border-color: #bae6fd; }
.fm-surec-adim-mini.fm-sm-bekliyor { background: #fef9c3; color: #854d0e; border-color: rgba(202,138,4,.25); }
.fm-surec-adim-mini.fm-sm-eksik { background: #ffedd5; color: #9a3412; border-color: rgba(249,115,22,.25); }
.fm-surec-adim-mini.fm-sm-yok { opacity: .45; }
.fm-calisma-modu { display: inline-block; font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }
.fm-cm-goruntuleme { background: var(--rm-bg2); color: var(--rm-t3); }
.fm-cm-inceleme { background: #fef9c3; color: #854d0e; }
.fm-cm-onay { background: #dcfce7; color: #166534; }
.fm-cm-muhasebe { background: #f3e8ff; color: #6b21a8; }
.fm-cm-kilit { background: #f1f5f9; color: #64748b; }
.fm-baglanti-liste { font-size: 10px; }
.fm-baglanti-satir { display: grid; grid-template-columns: 72px 1fr auto; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--rm-border); }
.fm-baglanti-satir:last-child { border-bottom: none; }
.fm-baglanti-tip { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--rm-t3); }
.fm-baglanti-kod { font-family: 'Courier New', monospace; font-size: 10px; color: var(--rm-t2); }
.fm-baglanti-unvan { font-size: 10px; color: var(--rm-t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fm-baglanti-link { font-size: 9px; font-weight: 600; color: var(--rm-teal); text-decoration: none; white-space: nowrap; }
.fm-baglanti-link:hover { text-decoration: underline; }
.fm-baglanti-metin { font-size: 9px; color: var(--rm-t4); }
@media (max-width: 1100px) {
  .fm-layout-unified { grid-template-columns: 1fr; }
  .fm-kpi-compact { grid-template-columns: repeat(3, 1fr); }
  .fd-kuyruk-genis { grid-template-columns: 1fr; }
}

/* Belge workspace (ERP çalışma ekranı) */
.fbw-sayfa { min-height: calc(100vh - 120px); }
.fbw-ust-bar {
  display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px;
  padding: 10px 12px; background: var(--rm-white); border: 1px solid var(--rm-border); border-radius: var(--fm-radius-sm);
  margin-bottom: 8px;
}
.fbw-ust-sol { min-width: 0; flex: 1; }
.fbw-belge-no { font-size: 16px; font-weight: 800; color: var(--rm-t1); font-family: 'Courier New', monospace; }
.fbw-belge-meta { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; font-size: 10px; color: var(--rm-t2); }
.fbw-meta-item strong { color: var(--rm-t1); font-weight: 700; }
.fbw-ust-sag { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.fbw-layout { display: grid; grid-template-columns: 25% 75%; gap: 8px; align-items: start; min-width: 0; }
.fbw-liste { min-width: 0; display: flex; flex-direction: column; max-height: calc(100vh - 220px); }
.fbw-liste-scroll { overflow: auto; flex: 1; min-height: 200px; }
.fbw-liste-item {
  display: block; padding: 8px 10px; border-bottom: 1px solid #f1f5f9; text-decoration: none; color: inherit;
  cursor: pointer; transition: background .1s;
}
.fbw-liste-item:hover { background: #f8fafc; }
.fbw-liste-item.aktif { background: #fef9e7; border-left: 3px solid var(--rm-gold); padding-left: 7px; }
.fbw-li-no { font-size: 10px; font-weight: 700; font-family: 'Courier New', monospace; color: var(--rm-t2); }
.fbw-li-alt { font-size: 9px; color: var(--rm-t3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fbw-workspace { min-width: 0; display: flex; flex-direction: column; max-height: calc(100vh - 220px); background: var(--rm-white); border: 1px solid var(--rm-border); border-radius: var(--fm-radius-sm); overflow: hidden; }
.fbw-ws-body { flex: 1; overflow-y: auto; min-height: 0; }
.fbw-tab-panel { display: none; padding: 12px 14px; }
.fbw-tab-panel.aktif { display: block; }
.fbw-timeline { position: relative; padding-left: 18px; margin: 8px 0; }
.fbw-timeline::before { content: ''; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 2px; background: var(--rm-border); }
.fbw-tl-adim { position: relative; padding: 0 0 14px 12px; font-size: 11px; }
.fbw-tl-adim::before {
  content: ''; position: absolute; left: -15px; top: 4px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--rm-border2); border: 2px solid var(--rm-white);
}
.fbw-tl-adim.tamam::before { background: var(--rm-green); }
.fbw-tl-adim.aktif::before { background: var(--rm-teal); box-shadow: 0 0 0 2px #bae6fd; }
.fbw-tl-baslik { font-weight: 700; color: var(--rm-t1); }
.fbw-tl-tarih { font-size: 10px; color: var(--rm-t3); margin-top: 2px; }
.fbw-ek-bos { text-align: center; padding: 32px 16px; color: var(--rm-t3); font-size: 11px; }
.fbw-drill-btn { display: inline-block; margin-top: 8px; font-size: 10px; font-weight: 600; color: var(--rm-teal); text-decoration: none; }
.fbw-drill-btn:hover { text-decoration: underline; }
@media (max-width: 1100px) {
