<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Usta Paneli — Solariz CPS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#f97316">
<link rel="stylesheet" href="{{ url_for('static', filename='css/usta.css') }}?v={{ range(100000, 999999) | random }}">
</head>
<body>

<header class="u-header">
  <div class="u-header-icin">
    <div class="u-logo">
      <span class="u-logo-emoji">🏭</span>
      <span class="u-logo-text">USTA PANEL</span>
    </div>
    <div class="u-kullanici">
      <span id="ustaAd">{{ session.get('kullanici', {}).get('AdSoyad', session.get('kullanici', {}).get('KullaniciAdi', '?')) }}</span>
      <a href="/cikis" class="u-cikis">Çıkış</a>
    </div>
  </div>
</header>

<nav class="u-tabs">
  <button class="u-tab active" data-tab="isler">📋 İŞLER</button>
  <button class="u-tab" data-tab="giris">➕ GİRİŞ</button>
  <button class="u-tab" data-tab="onay">✓ ONAY <span id="onayBadge" class="u-badge"></span></button>
</nav>

<main class="u-main">

  <!-- ============ İŞLER SEKMESİ ============ -->
  <section class="u-pane active" id="pane-isler">
    <div class="u-pane-header">
      <h2>Açık İşlerim</h2>
      <button class="u-yenile" id="islerYenileBtn" title="Yenile">↻</button>
    </div>
    <div id="islerError" class="u-error" style="display:none;"></div>
    <div id="islerList" class="u-card-list">
      <div class="u-empty">Yükleniyor...</div>
    </div>
  </section>

  <!-- ============ VERİ GİRİŞ SEKMESİ ============ -->
  <section class="u-pane" id="pane-giris">

    <!-- ADIM 1: Hat Seçimi -->
    <div id="adim-hat" class="u-adim">
      <div class="u-pane-header">
        <h2>Hangi Bölüm?</h2>
      </div>
      <div id="hatListeError" class="u-error" style="display:none;"></div>
      <div id="hatListeWrap" class="u-hat-liste">
        <div class="u-empty">Yükleniyor...</div>
      </div>
    </div>

    <!-- ADIM 2: Önümdeki İşler -->
    <div id="adim-isler" class="u-adim" style="display:none;">
      <div class="u-pane-header">
        <button class="u-geri-btn" id="islerGeriBtn">← Geri</button>
        <h2 id="seciliHatBaslik">Bölüm</h2>
        <button class="u-yenile" id="onumdekiYenileBtn" title="Yenile">↻</button>
      </div>
      <div id="onumdekiError" class="u-error" style="display:none;"></div>
      <div id="onumdekiList" class="u-card-list">
        <div class="u-empty">Yükleniyor...</div>
      </div>
    </div>

    <!-- ADIM 3: Kayıt Formu (Başlat / Bitir) -->
    <div id="adim-form" class="u-adim" style="display:none;">
      <div class="u-pane-header">
        <button class="u-geri-btn" id="formGeriBtn">← Geri</button>
        <h2>Üretim Kaydı</h2>
      </div>

      <!-- Seçilen iş özeti -->
      <div id="formEmirozet" class="u-emir-ozet"></div>

      <div id="formError" class="u-error" style="display:none;"></div>
      <div id="formSuccess" class="u-success" style="display:none;"></div>

      <form id="uretimForm" onsubmit="return false;">

        <div class="u-field">
          <label>Toplam Miktar (çift) <span class="u-zorunlu">*</span></label>
          <input type="number" id="fToplamMiktar" min="1" inputmode="numeric"
                 placeholder="Üretilen çift sayısı">
        </div>

        <div class="u-field">
          <label>Başlangıç Saati</label>
          <input type="time" id="fBaslangicSaat">
        </div>

        <div class="u-field">
          <label>Bitiş Saati</label>
          <input type="time" id="fBitisSaat">
        </div>

        <!-- Ekip Girişi -->
        <div class="u-field-group">
          <label class="u-field-group-baslik">Kim Yaptı? <span class="u-aciklama">(kişi bazında dağılım)</span></label>
          <div id="ekipSatirlar">
            <!-- JS ile dinamik eklenir -->
          </div>
          <button type="button" class="u-btn u-btn-ghost u-btn-sm" id="ekipEkleBtn">+ Kişi Ekle</button>
        </div>

        <div class="u-field">
          <label>Not</label>
          <textarea id="fNot" rows="2" placeholder="(opsiyonel)"></textarea>
        </div>

        <!-- Kapatan (oturum sahibi) -->
        <div class="u-kapatan-satir">
          <span class="u-kapatan-label">Kapatan:</span>
          <span id="fKapatan" class="u-kapatan-ad">—</span>
        </div>

        <div class="u-actions">
          <button type="button" class="u-btn u-btn-primary u-btn-lg" id="formKaydetBtn">
            ✓ KAYDET
          </button>
          <button type="button" class="u-btn u-btn-ghost" id="formIptalBtn">Temizle</button>
        </div>

      </form>
    </div>

  </section>

  <!-- ============ ONAY SEKMESİ ============ -->
  <section class="u-pane" id="pane-onay">
    <div class="u-pane-header">
      <h2>Bekleyen Onaylar</h2>
      <button class="u-yenile" id="onayYenileBtn" title="Yenile">↻</button>
    </div>
    <div id="onayError" class="u-error" style="display:none;"></div>
    <div id="onayList" class="u-card-list">
      <div class="u-empty">Yükleniyor...</div>
    </div>
  </section>

</main>

<script src="{{ url_for('static', filename='js/usta.js') }}?v={{ range(100000, 999999) | random }}"></script>
</body>
</html>
